name: Release

# A merge to main keeps the release PR up to date. Merging the release PR builds the app on a
# macOS runner; only a green build creates the tag and the release, which then gets the app and
# is published. A failed build leaves no tag: the next push to main tries again (docs/releasing.md).

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release PR's branch
      pull-requests: write # the release PR and its labels

    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  pending:
    name: Untagged version
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the manifest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find a version without its tag
        id: version
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is tagged already, nothing to build."
          else
            echo "v$version has no tag yet: building it."
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the app
    needs: pending
    if: needs.pending.outputs.version != ''
    runs-on: macos-latest
    permissions:
      contents: read # check out the repository
    env:
      VERSION: ${{ needs.pending.outputs.version }}
      APP: src-tauri/target/release/bundle/macos/Inbox for GitHub.app

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up Rust
        run: rustup toolchain install

      - name: Install
        run: npm ci

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      # The remaps keep the runner's paths out of the binary; the more specific one comes last and wins.
      # The short commit is the bundle version, so About reads "Version 0.3.1 (01d877d)".
      - name: Build
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/src"
          npm run tauri build -- --bundles app --config "{\"bundle\":{\"macOS\":{\"bundleVersion\":\"${GITHUB_SHA::7}\"}}}" -- --locked

      - name: Check the bundle
        run: |
          plist="$APP/Contents/Info.plist"
          built=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          [ "$built" = "$VERSION" ] || { echo "The bundle says $built, the manifest $VERSION."; exit 1; }
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
          [ "$build" = "${GITHUB_SHA::7}" ] || { echo "The bundle's build is $build, the commit ${GITHUB_SHA::7}."; exit 1; }
          lipo -archs "$APP/Contents/MacOS/inbox-for-github" | grep -qx arm64 || { echo "Not an arm64 build."; exit 1; }
          codesign --verify --deep --strict "$APP" || { echo "The bundle's signature is incomplete; a download would open as damaged."; exit 1; }
          if strings -a "$APP/Contents/MacOS/inbox-for-github" | grep -E '/Users/|/home/'; then
            echo "The binary holds local paths."; exit 1
          fi
          if grep -r -l -E '/Users/|/home/runner' dist; then
            echo "The web assets hold local paths."; exit 1
          fi

      - name: Zip
        run: ditto -c -k --keepParent "$APP" "Inbox-for-GitHub-$VERSION.zip"

      - name: Keep the zip for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: Inbox-for-GitHub-*.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Tag and publish
    needs: [pending, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag, the release and its download
      pull-requests: write # label the release PR as tagged
    env:
      VERSION: ${{ needs.pending.outputs.version }}

    steps:
      - name: Create the tag and the draft release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Check the release
        env:
          CREATED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          [ "$CREATED" = "true" ] && [ "$TAG" = "v$VERSION" ] || { echo "Expected a release v$VERSION, got '$TAG' (created: $CREATED)."; exit 1; }

      - name: Fetch the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app

      - name: Attach the app and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" "Inbox-for-GitHub-$VERSION.zip" --repo "$GITHUB_REPOSITORY"
          gh release edit "v$VERSION" --draft=false --repo "$GITHUB_REPOSITORY"
